apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-ui-test
  labels:
    app.kubernetes.io/name: rollouts-ui-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rollouts-ui-test
  strategy:
    canary:
      stableService: rollouts-ui-test-stable
      canaryService: rollouts-ui-test-canary
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollouts-ui-test
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-ui-test-stable
  labels:
    app.kubernetes.io/name: rollouts-ui-test
spec:
  selector:
    app.kubernetes.io/name: rollouts-ui-test
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-ui-test-canary
  labels:
    app.kubernetes.io/name: rollouts-ui-test
spec:
  selector:
    app.kubernetes.io/name: rollouts-ui-test
  ports:
    - port: 80
      targetPort: 8080
